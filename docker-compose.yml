version: '3'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    # ports:
    #   - "5000:5000"
    volumes:
      - ./backend:/app
    environment:
      - FLASK_ENV=development
    container_name: flask-backend

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    # ports:
    #   - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    depends_on:
      - backend
    container_name: react-frontend

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend
